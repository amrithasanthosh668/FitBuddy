<!DOCTYPE html>
<html>

<head>

    <title>FitBuddy - AI Fitness Plan Generator</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f7f6;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #555;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .admin-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>💪 FitBuddy</h1>

    <p class="subtitle">
        AI Fitness Plan Generator
    </p>

    <div class="card">

        <form action="/generate" method="post">

            <label for="name">Name</label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                required
            >

            <label for="user_id">User ID</label>

            <input
                type="text"
                id="user_id"
                name="user_id"
                placeholder="Enter your user ID"
                required
            >

            <label for="age">Age</label>

            <input
                type="number"
                id="age"
                name="age"
                min="13"
                max="100"
                required
            >

            <label for="weight">Weight (kg)</label>

            <input
                type="number"
                id="weight"
                name="weight"
                min="1"
                step="0.1"
                placeholder="Example: 60"
                required
            >

            <label for="goal">Fitness Goal</label>

            <select id="goal" name="goal" required>

                <option value="weight_loss">
                    Weight Loss
                </option>

                <option value="muscle_gain">
                    Muscle Gain
                </option>

                <option value="general_wellness">
                    General Wellness
                </option>

            </select>

            <label for="level">Fitness Level</label>

            <select id="level" name="level" required>

                <option value="beginner">
                    Beginner
                </option>

                <option value="intermediate">
                    Intermediate
                </option>

                <option value="advanced">
                    Advanced
                </option>

            </select>

            <label for="intensity">Workout Intensity</label>

            <select id="intensity" name="intensity" required>

                <option value="low">
                    Low
                </option>

                <option value="medium">
                    Medium
                </option>

                <option value="high">
                    High
                </option>

            </select>

            <label for="time">Available Time</label>

            <input
                type="text"
                id="time"
                name="time"
                placeholder="Example: 30 minutes"
                required
            >

            <button type="submit">
                ✨ Generate My Plan
            </button>

        </form>

    </div>

    <a class="admin-link" href="/admin">
        📊 Open Admin View
    </a>

</div>

</body>

</html>
